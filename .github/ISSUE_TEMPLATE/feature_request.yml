name: Feature request
description: Propose a bounded improvement to TypeSafe-as-a-Judge.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or agent problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the intended inputs, outputs, tool boundary, and review behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Safety and scope
      options:
        - label: This proposal keeps authorization and destructive actions outside the MCP judgment.
          required: true
        - label: This proposal does not require sharing secrets in prompts or repository files.
          required: true
